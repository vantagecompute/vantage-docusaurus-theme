# Build both halves of the repository on every pull request and on main.
#
# The two jobs are separate because they install differently and fail for
# different reasons: the package builds from the root lockfile, the
# documentation site from its own (both Yarn 4). Splitting them means a
# broken docs build never hides a broken package build.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Set the repository variable USE_SELF_HOSTED_RUNNERS to "true" to run the
# jobs below in the vantage-eng runner group; otherwise they run on GitHub-hosted
# ubuntu-26.04. SELF_HOSTED_RUNS_ON, a runs-on value in JSON such as
# ["self-hosted", "Linux", "X64"], replaces the default runner set. Self-hosted
# runners keep the package manager cache on local disk, so setup-node syncs
# the actions cache only on GitHub-hosted runners.
jobs:
  package:
    name: build package
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up Yarn (pinned by packageManager, checksum-verified)
        uses: ./.github/actions/setup-yarn

      - run: yarn install --immutable

      - run: yarn build

      # The option validator is tested against lib/, the compiled output
      # consumers get, so this has to follow the build.
      - run: yarn test

      # `files` in package.json decides what reaches consumers, and it is the
      # one thing a successful `tsc` says nothing about. Pack the tarball and
      # assert the assets the design system references are inside it, so a file
      # added outside lib/, src/ or static/ fails here rather than in a
      # consumer's site.
      - name: Verify the tarball ships its assets
        run: |
          set -euo pipefail
          contents=$(yarn pack --dry-run --json | tr -d ' ')
          missing=0
          for asset in \
            lib/index.cjs \
            lib/index.d.cts \
            lib/options.cjs \
            src/css/custom.css \
            src/utils/rehypeTabsTransform.js \
            src/theme/Mermaid/index.js \
            src/theme/Mermaid/config.js \
            static/fonts/Satoshi-Regular.woff \
            static/img/vantage-logo-color.svg \
            static/img/favicon.ico
          do
            if ! grep -q "\"$asset\"" <<<"$contents"; then
              echo "not in the tarball: $asset"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Likely cause: a file was added outside the directories listed"
            echo "in \`files\` in package.json."
            exit 1
          fi

          echo "Tarball contents OK"

  docs:
    name: build docs
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    steps:
      # fetch-depth: 0 for the same reason the deploy workflow needs it: the
      # version badge comes from `git describe --tags`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up Yarn (pinned by packageManager, checksum-verified)
        uses: ./.github/actions/setup-yarn

      - name: Install docs dependencies
        working-directory: docusaurus
        run: yarn install --immutable

      # Lockfile-exact, the same versions deploy-docs.yml publishes. A theme
      # release that breaks the build fails on its Dependabot lockfile PR.
      - name: Typecheck
        working-directory: docusaurus
        run: yarn typecheck

      # `onBrokenLinks: 'throw'` means this also checks every internal link on
      # the site.
      - name: Build docs
        working-directory: docusaurus
        run: yarn build
