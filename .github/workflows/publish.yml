name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Stays on a GitHub-hosted runner: provenance can only be attested from
    # one.
    runs-on: ubuntu-latest

    # npm trusted publishing: `yarn npm publish` exchanges this job's GitHub
    # OIDC token (id-token: write, above) for a short-lived publish credential,
    # against the trusted publisher configured for this repository and this
    # workflow file on npmjs.com. No long-lived NPM_TOKEN to expire: 0.5.5's
    # publish failed with E404 on PUT because the token had. Yarn 4 does the
    # exchange itself, so there is no npm CLI to install or pin.
    #
    # There is deliberately no `registry-url` on setup-node. It writes an .npmrc
    # holding the literal `${NODE_AUTH_TOKEN}`, which nothing here needs: Yarn
    # publishes to registry.npmjs.org by default.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up Yarn (pinned by packageManager, checksum-verified)
        uses: ./.github/actions/setup-yarn

      - run: yarn install --immutable

      - run: yarn build

      # `prepack` builds again; harmless, and it keeps a local `yarn npm publish`
      # from shipping a stale lib/.
      - run: yarn npm publish --provenance --access public
